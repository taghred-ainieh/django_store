{% load i18n %}
<div class="product card mb-4">
  <img src="{{ product.image.url }}" class="card-img-top" alt="..." />
  <div
    class="card-img-overlay d-flex flex-column align-items-center justify-content-center"
  >
    <a class="btn btn-outline-light" href="{%url 'cart_add' product.id %}"> {% trans "add to cart" %} </a>
    <a class="btn btn-outline-light mt-2" href="{%url 'store_product' product.id%}">{% trans "view" %}</a>
  </div>
  <div class="card-body">
    <h6 class="text-muted">{{product.author}}</h6>
    <h6 class="card-title">{{product.name}}</h6>
    <strong class="fw-bold text-success">{{product.price}}$</strong>
  </div>
</div>
